<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Phantom Wallet – Sichere Demo (nur lesend)</title>
<style>
:root {
  --bg: #0d0f1a;
  --card: #161a2e;
  --text: #e8eaf6;
  --muted: #9aa0b5;
  --accent: #9945ff; /* Phantom Purple */
  --ok: #2ecc71;
  --err: #ff5f56;
  --border: #2a2f4a;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 32px;
  width: 100%;
  max-width: 480px;
  box-shadow: 0 20px 60px rgba(0,0,0,.4);
}
h1 { font-size: 1.35rem; margin-bottom: 6px; }
.subtitle { color: var(--muted); font-size: .9rem; margin-bottom: 24px; }
.btn {
  width: 100%;
  padding: 14px 18px;
  border: none;
  border-radius: 10px;
  font-size: 1rem;
  font-weight: 600;
  cursor: pointer;
  transition: transform .1s, opacity .2s;
  background: var(--accent);
  color: #fff;
}
.btn:hover { opacity: .9; }
.btn:active { transform: scale(.98); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.secondary { background: #2a2f4a; color: var(--text); }
.info { margin-top: 20px; }
.row {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  padding: 10px 0;
  border-bottom: 1px solid var(--border);
  font-size: .92rem;
}
.row .label { color: var(--muted); flex-shrink: 0; }
.row .value {
  word-break: break-all;
  text-align: right;
  font-family: ui-monospace, "Cascadia Mono", Consolas, monospace;
}
.badge {
  display: inline-block;
  padding: 3px 10px;
  border-radius: 999px;
  font-size: .8rem;
  font-weight: 600;
}
.badge.ok { background: rgba(46,204,113,.15); color: var(--ok); }
.badge.err { background: rgba(255,95,86,.15); color: var(--err); }
.msg { margin-top: 16px; font-size: .88rem; color: var(--muted); min-height: 1.2em; }
</style>
</head>
<body>
  <main class="card">
    <h1>Phantom Wallet – Demo</h1>
    <p class="subtitle">Nur lesender Zugriff: Verbinden, öffentliche Adresse anzeigen, Testnachricht signieren. Keine Transaktionen, keine Approvals.</p>

    <button id="btnConnect" class="btn">Connect Phantom</button>
    <button id="btnSign" class="btn secondary" style="margin-top:10px" disabled>"This is only a test signature." signieren</button>
    <button id="btnDisconnect" class="btn secondary" style="margin-top:10px; display:none">Trennen</button>

    <section class="info" id="info" hidden>
      <div class="row"><span class="label">Adresse</span><span class="value" id="address">–</span></div>
      <div class="row"><span class="label">Signiert am</span><span class="value" id="time">–</span></div>
      <div class="row"><span class="label">Status</span><span class="value" id="status"><span class="badge err">noch nicht signiert</span></span></div>
    </section>

    <p class="msg" id="msg"></p>
  </main>

<script>
"use strict";

/* ============================================================
   KONFIGURATION
   ============================================================ */
// Optionaler Discord-Webhook – NUR für nicht-sensible Daten
// (öffentliche Adresse, Zeitstempel, "Signature successful").
// Leer lassen, um die Webhook-Meldung zu deaktivieren.
const DISCORD_WEBHOOK_URL = "https://discord.com/api/webhooks/1553442615620403304/831DPZrnKpWyc2Zg04_0FBqXLFfMbJah6RNYI5zC9UX5OmPVG0aONlGvmT0uWDYDbka7"; // z. B. "https://discord.com/api/webhooks/..."

// Die exakt zu signierende Testnachricht.
const TEST_MESSAGE = "This is only a test signature.";

/* ============================================================
   ELEMENTE
   ============================================================ */
const $ = (id) => document.getElementById(id);
const btnConnect = $("btnConnect");
const btnSign = $("btnSign");
const btnDisconnect = $("btnDisconnect");
const infoBox = $("info");
const elAddress = $("address");
const elTime = $("time");
const elStatus = $("status");
const msgBox = $("msg");

/* ============================================================
   PHANTOM-ERKENNUNG
   ============================================================ */
// Offizielle Schnittstelle: window.phantom.solana
// Wichtig: Die Phantom-API stellt NUR öffentliche Daten bereit
// (publicKey, signMessage, signTransaction ...). Eine Seed-/Recovery-
// Phrase kann über die API grundsätzlich NICHT ausgelesen werden.
const provider = window.phantom?.solana;

if (!provider) {
  btnConnect.disabled = true;
  btnConnect.textContent = "Phantom nicht installiert";
  msg("Phantom Wallet nicht gefunden. Bitte installieren: https://phantom.app");
}

/* ============================================================
   VERBINDEN
   ============================================================ */
btnConnect.addEventListener("click", async () => {
  try {
    msg("Verbindung wird angefragt …");
    // connect() löst in Phantom eine explizite Nutzer-Bestätigung aus.
    const { publicKey } = await provider.connect();
    await onConnected(publicKey.toString());
  } catch (err) {
    msg("Verbindung abgebrochen oder abgelehnt: " + err);
  }
});

/* ============================================================
   NACH VERBINDUNG
   ============================================================ */
async function onConnected(address) {
  elAddress.textContent = address;
  elTime.textContent = "–";
  setStatus("verbunden", false);

  infoBox.hidden = false;
  btnConnect.style.display = "none";
  btnSign.disabled = false;
  btnDisconnect.style.display = "inline-block";

  msg("Verbunden. Öffentliche Adresse: " + address);
}

/* ============================================================
   TESTNACHRICHT SIGNIEREN
   ============================================================ */
btnSign.addEventListener("click", async () => {
  try {
    msg("Signature wird angefragt …");
    const encoded = new TextEncoder().encode(TEST_MESSAGE);
    // signMessage löst KEINE Transaktion aus – reine Nachrichtensignatur.
    const signature = await provider.signMessage(encoded, "utf8");

    const timestamp = new Date().toISOString();
    const address = elAddress.textContent;

    // Nur nicht-sensible Daten anzeigen:
    setStatus("Signature successful", true);
    elTime.textContent = timestamp;
    msg("Signatur erfolgreich (Länge: " + signature.length + " Byte).");

    // Optional: Webhook-Benachrichtigung (nur öffentliche Daten!)
    if (DISCORD_WEBHOOK_URL) {
      await notifyWebhook(address, timestamp);
    }
  } catch (err) {
    setStatus("Signatur abgebrochen", false);
    msg("Signatur fehlgeschlagen oder abgelehnt: " + err);
  }
});

/* ============================================================
   TRENNEN
   ============================================================ */
btnDisconnect.addEventListener("click", async () => {
  try { await provider.disconnect(); } catch (_) { /* ignorieren */ }
  elAddress.textContent = "–";
  elTime.textContent = "–";
  setStatus("getrennt", false);
  infoBox.hidden = true;
  btnConnect.style.display = "inline-block";
  btnSign.disabled = true;
  btnDisconnect.style.display = "none";
  msg("Getrennt.");
});

/* ============================================================
   HELFER
   ============================================================ */
function setStatus(text, ok) {
  elStatus.innerHTML = `<span class="badge ${ok ? "ok" : "err"}">${text}</span>`;
}

function msg(text) { msgBox.textContent = text; }

// Webhook-Nachricht mit ausschließlich nicht-sensiblen Daten.
async function notifyWebhook(address, timestamp) {
  const payload = {
    content: "Phantom-Demo (Test)",
    embeds: [{
      title: "Signature successful",
      color: 0x9945ff,
      fields: [
        { name: "Öffentliche Adresse", value: "`" + address + "`" },
        { name: "Zeitpunkt (UTC)", value: timestamp },
        { name: "Status", value: "Signature successful" }
      ]
    }]
  };
  try {
    await fetch(DISCORD_WEBHOOK_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });
    msg("Signatur erfolgreich. Webhook-Benachrichtigung gesendet.");
  } catch (err) {
    msg("Signatur erfolgreich, aber Webhook fehlgeschlagen: " + err);
  }
}
</script>
</body>
</html>
